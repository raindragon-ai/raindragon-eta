<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Turn ETA options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; max-width: 520px; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #1f1f1e; } }
  label { display: block; margin: 12px 0; }
  .hint { color: #777; font-size: 12px; margin-left: 24px; }
  button { margin-top: 12px; }
  #saved { margin-left: 8px; color: #2e7d32; }
</style>
</head>
<body>
<h2>Turn ETA</h2>
<label>Band width
  <select id="band">
    <option value="50">Middle half of similar replies</option>
    <option value="80">Middle 8 in 10 (wider, misses less often)</option>
  </select>
</label>
<label><input type="checkbox" id="showResult"> Show the actual time after each reply</label>
<label><input type="checkbox" id="checkStatus"> Check Claude status</label>
<div class="hint">Reads status.claude.com every 2 minutes to warn when claude.ai has an incident.</div>
<p class="hint" id="count"></p>
<button id="clear">Clear my history</button><span id="saved"></span>
<script src="options.js"></script>
</body>
</html>
